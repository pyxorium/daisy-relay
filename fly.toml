# Daisy's relay on Fly.io (build step 5). Modelled on the die-relay app (C:\thunderbird-cafe\wish-die-demo\relay).
#
# DEPLOY WITH:   fly deploy --ha=false
# Fly's default is TWO machines on a first deploy. The tables live in one process's memory, so with two
# machines a table's two pages could land on different machines and never meet. After deploying, run
# `fly status`: there must be exactly ONE machine. If two: `fly scale count 1`.
#
# The app name is separate from the public address, relay.daisy.thunderbird.cafe (DNS records at Wix plus
# `fly certs add relay.daisy.thunderbird.cafe`). App names are global ("daisy-relay" was taken, Oct 18); if this one is, pick
# another here and in the commands.
app = 'thunderbird-daisy-relay'
primary_region = 'sjc'

[build]

[env]
  PORT = '8080'
  # Pages allowed to use the relay (comma-separated). The local dev page (http://127.0.0.1:4321) stays
  # allowed (owner, Oct 19: option B), so a change can be tried against the real relay from `npm run dev`
  # before it goes live; the origin check is a courtesy, not a lock. Step 6's probe page (4322) is gone.
  ALLOWED_ORIGINS = 'https://thunderbird.cafe,http://127.0.0.1:4321'

[http_service]
  internal_port = 8080
  force_https = true
  # Always on (owner, Oct 19, for going public): one machine stays running, so nobody waits for a start.
  # To be revisited in two months (a scheduled reminder, Dec 18 2026) with the other Fly apps. To let it
  # sleep when nobody is connected again: min_machines_running = 0, then `fly deploy --ha=false`. (Fly
  # stops it only when no connection is open: an open WebSocket counts, concurrency by connections below.)
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '3s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
